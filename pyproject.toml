[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nawah-ara"
version = "0.1.0"
description = "Arabic programming library for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Nawah Developer"}
]

[tool.setuptools.packages.find]
where = ["src"]